name: C2DTerminal
options:
  bundleIdPrefix: works.c2d
  deploymentTarget:
    macOS: "15.0"   # PROPOSED — see docs/DECISIONS.md ADR-002
  createIntermediateGroups: true
packages:
  C2DCore:
    path: Packages/C2DCore
targets:
  C2DTerminal:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: C2DCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.c2d.terminal
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: C2D Terminal
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Ad-hoc signing: dev builds need no team or certificate. Release signing is a separate, later decision (Bible Part 17).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO   # PROPOSED — see ADR-003
