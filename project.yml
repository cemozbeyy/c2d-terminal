name: C2DTerminal
options:
  bundleIdPrefix: works.c2d
  deploymentTarget:
    macOS: "15.0"   # CONFIRMED (ADR-002)
  createIntermediateGroups: true
packages:
  C2DCore:
    path: Packages/C2DCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.0   # ADR-009; review every bump
targets:
  C2DTerminal:
    type: application
    platform: macOS
    sources:
      - App
      # Token Saver paired-experiment runner: copied as-is into Resources/experiment (folder reference, never compiled).
      - path: Tools/experiment
        type: folder
        buildPhase: resources
    dependencies:
      - package: C2DCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: works.c2d.terminal
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: C2D Terminal
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Ad-hoc signing: dev builds need no team or certificate. Release signing is a separate, later decision (Bible Part 17).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO   # PROPOSED — see ADR-003
        ARCHS: arm64             # CONFIRMED — ADR-006, Intel deferred
