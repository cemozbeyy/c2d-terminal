name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests-floor:
    name: C2DCore tests (macOS 15 runner, lowest toolchain)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path Packages/C2DCore

  app-build:
    name: App build (macOS 26 runner)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path Packages/C2DCore
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build
          -project C2DTerminal.xcodeproj
          -scheme C2DTerminal
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
