name: Release
# Builds the release artifacts (ADR-039). Runs unsigned until the Developer ID secrets exist; with them it signs,
# notarizes and generates the Sparkle appcast. A tag push only ever creates a DRAFT GitHub release, and only for a
# signed build: unsigned artifacts stay workflow artifacts (30 days) and never reach the Releases page. Publishing,
# copying appcast.xml to the website and bumping the Homebrew cask stay manual (docs/RELEASE_RUNBOOK.md).
#
# Secrets (all optional; signing needs the first four together). Each one is passed only to the step that uses it.
#   C2D_SIGN_P12_BASE64      Developer ID Application certificate + key, .p12, base64
#   C2D_SIGN_P12_PASSWORD    its password
#   C2D_SIGN_IDENTITY        "Developer ID Application: <Name> (<TEAMID>)"
#   C2D_TEAM_ID              <TEAMID>
#   C2D_NOTARY_APPLE_ID      Apple ID for notarytool      \
#   C2D_NOTARY_PASSWORD      app-specific password         } all three → notarize + staple
#   (team id reused)                                       /
#   C2D_SPARKLE_PUBLIC_KEY   EdDSA public key (base64)   → embedded in the app
#   C2D_SPARKLE_PRIVATE_KEY  EdDSA private key (generate_keys -x output) → signs appcast.xml
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write   # draft release only (gh release create --draft)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0          # build number = commit count

      - name: Detect credentials
        id: creds
        env:
          SIGN_IDENTITY: ${{ secrets.C2D_SIGN_IDENTITY }}
          TEAM_ID: ${{ secrets.C2D_TEAM_ID }}
          P12: ${{ secrets.C2D_SIGN_P12_BASE64 }}
          NOTARY_ID: ${{ secrets.C2D_NOTARY_APPLE_ID }}
          NOTARY_PW: ${{ secrets.C2D_NOTARY_PASSWORD }}
          SPARKLE_PUB: ${{ secrets.C2D_SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIV: ${{ secrets.C2D_SPARKLE_PRIVATE_KEY }}
        run: |
          signed=false; notarize=false; appcast=false
          if [ -n "$SIGN_IDENTITY" ] && [ -n "$TEAM_ID" ] && [ -n "$P12" ]; then signed=true; fi
          if [ "$signed" = true ] && [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PW" ]; then notarize=true; fi
          if [ "$signed" = true ] && [ -n "$SPARKLE_PUB" ] && [ -n "$SPARKLE_PRIV" ]; then appcast=true; fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"; echo "notarize=$notarize" >> "$GITHUB_OUTPUT"; echo "appcast=$appcast" >> "$GITHUB_OUTPUT"
          echo "signed=$signed notarize=$notarize appcast=$appcast"

      - run: brew install xcodegen

      - name: Import Developer ID certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.C2D_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.C2D_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC=$RUNNER_TEMP/release.keychain-db; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

      - name: Store notarization credentials
        if: steps.creds.outputs.notarize == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.C2D_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.C2D_NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.C2D_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials c2d-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "C2D_NOTARY_PROFILE=c2d-notary" >> "$GITHUB_ENV"

      - name: Build release artifacts
        env:
          C2D_SIGN_IDENTITY: ${{ steps.creds.outputs.signed == 'true' && secrets.C2D_SIGN_IDENTITY || '' }}
          C2D_TEAM_ID: ${{ steps.creds.outputs.signed == 'true' && secrets.C2D_TEAM_ID || '' }}
          C2D_SPARKLE_PUBLIC_KEY: ${{ steps.creds.outputs.signed == 'true' && secrets.C2D_SPARKLE_PUBLIC_KEY || '' }}
        run: ./Scripts/build-release.sh

      - name: Generate Sparkle appcast
        if: steps.creds.outputs.appcast == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.C2D_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEYFILE=$(mktemp); chmod 600 "$KEYFILE"; trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          C2D_SPARKLE_PRIVATE_KEY_FILE=$KEYFILE ./Scripts/make-appcast.sh build/release/updates   # tools: build/release/sparkle-bin

      - name: Check artifact mode
        id: mode
        run: |
          MODE=$(grep -o 'mode=[a-z]*' build/release/RELEASE_INFO.txt | cut -d= -f2)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          cat build/release/RELEASE_INFO.txt
          if [ "$MODE" = unsigned ]; then ls build/release/*.dmg build/release/updates/*.zip | grep -q -- '-unsigned' || { echo "unsigned build without -unsigned suffix" >&2; exit 1; }; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: C2DTerminal-${{ steps.mode.outputs.mode }}
          path: |
            build/release/*.dmg
            build/release/updates/*.zip
            build/release/updates/appcast.xml
            build/release/SHA256SUMS
            build/release/RELEASE_INFO.txt
          retention-days: 30

      - name: Draft GitHub release (signed builds, tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.mode.outputs.mode == 'signed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Build: $(tr '\n' ' ' < build/release/RELEASE_INFO.txt)"
          gh release create "$GITHUB_REF_NAME" --draft --title "C2D Terminal $GITHUB_REF_NAME" --notes "$NOTES" \
            build/release/*.dmg build/release/updates/*.zip build/release/SHA256SUMS \
            $(ls build/release/updates/appcast.xml 2>/dev/null || true)

      - name: Unsigned build on a tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.mode.outputs.mode != 'signed'
        run: echo "::warning::Tag $GITHUB_REF_NAME built UNSIGNED (no Developer ID secrets). No release was drafted; artifacts are workflow artifacts only."
